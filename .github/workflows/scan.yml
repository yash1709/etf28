name: Daily ETF scan

# GitHub cron runs in UTC. 16:25 IST = 10:55 UTC, 23:30 IST = 18:00 UTC (weekdays).
# Runs can start several minutes late when GitHub is busy.
on:
  schedule:
    - cron: "55 10 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Show actions even if the data check fails (--force)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/scan.yml"

permissions:
  contents: read

concurrency:
  group: etf-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Install dependencies
        run: pip install -r requirements-scan.txt

      - name: Run scanner
        id: scan
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          mkdir -p reports
          set +e
          python scanner.py scan $FORCE 2>&1 | tee reports/scan_latest.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) status="Scan complete" ;;
            2) status="Data check failed, so the action list was withheld (Yahoo data is stale or incomplete). The next run will retry." ;;
            *) status="Scanner crashed (exit code $code)" ;;
          esac
          {
            echo "### ETF 28 scan: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            echo
            echo "**$status**"
            echo
            echo '```'
            cat reports/scan_latest.txt
            echo '```'
            echo
            echo "_Scans without a ledger, so BUY rows assume you hold nothing. Educational tool, not investment advice._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Fail only if the scanner crashed
        if: steps.scan.outputs.code != '0' && steps.scan.outputs.code != '2'
        run: exit 1
